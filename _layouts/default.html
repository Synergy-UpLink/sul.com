<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Fonts -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" />

  <!-- Styles -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />

  <!-- Theme: set before first paint to prevent flash of wrong color scheme -->
  <script>
    (function () {
      var stored = localStorage.getItem('su-theme');
      if (stored) {
        document.documentElement.setAttribute('data-theme', stored);
      }
    })();
  </script>

  <!-- Icons -->
  <link rel="apple-touch-icon-precomposed" sizes="57x57"
    href="{{ '/assets/images/apple-touch-icon-57x57.png' | relative_url }}" />
  <link rel="apple-touch-icon-precomposed" sizes="114x114"
    href="{{ '/assets/images/apple-touch-icon-114x114.png' | relative_url }}" />
  <link rel="apple-touch-icon-precomposed" sizes="72x72"
    href="{{ '/assets/images/apple-touch-icon-72x72.png' | relative_url }}" />
  <link rel="apple-touch-icon-precomposed" sizes="144x144"
    href="{{ '/assets/images/apple-touch-icon-144x144.png' | relative_url }}" />
  <link rel="apple-touch-icon-precomposed" sizes="60x60"
    href="{{ '/assets/images/apple-touch-icon-60x60.png' | relative_url }}" />
  <link rel="apple-touch-icon-precomposed" sizes="120x120"
    href="{{ '/assets/images/apple-touch-icon-120x120.png' | relative_url }}" />
  <link rel="apple-touch-icon-precomposed" sizes="76x76"
    href="{{ '/assets/images/apple-touch-icon-76x76.png' | relative_url }}" />
  <link rel="apple-touch-icon-precomposed" sizes="152x152"
    href="{{ '/assets/images/apple-touch-icon-152x152.png' | relative_url }}" />
  <link rel="icon" type="image/png" href="{{ '/assets/images/favicon-196x196.png' | relative_url }}" sizes="196x196" />
  <link rel="icon" type="image/png" href="{{ '/assets/images/favicon-96x96.png' | relative_url }}" sizes="96x96" />
  <link rel="icon" type="image/png" href="{{ '/assets/images/favicon-32x32.png' | relative_url }}" sizes="32x32" />
  <link rel="icon" type="image/png" href="{{ '/assets/images/favicon-16x16.png' | relative_url }}" sizes="16x16" />
  <link rel="icon" type="image/png" href="{{ '/assets/images/favicon-128.png' | relative_url }}" sizes="128x128" />
  <meta name="application-name" content="Synergy UpLink" />
  <meta name="msapplication-TileColor" content="#000000" />
  <meta name="msapplication-TileImage" content="{{ '/assets/images/mstile-144x144.png' | relative_url }}" />
  <meta name="msapplication-square70x70logo" content="{{ '/assets/images/mstile-70x70.png' | relative_url }}" />
  <meta name="msapplication-square150x150logo" content="{{ '/assets/images/mstile-150x150.png' | relative_url }}" />
  <meta name="msapplication-wide310x150logo" content="{{ '/assets/images/mstile-310x150.png' | relative_url }}" />
  <meta name="msapplication-square310x310logo" content="{{ '/assets/images/mstile-310x310.png' | relative_url }}" />
  <!-- SEO -->
  {% seo %}
</head>

<body>

  <!-- Navigation -->
  {% include nav.html %}

  <!-- Main content -->
  <main id="main">
    {{ content }}
  </main>

  <!-- Footer -->
  {% include footer.html %}

  <!-- Scripts -->
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>

</body>

</html>
